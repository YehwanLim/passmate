<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>Live 시험 도구</title>
    <style>
      body { font: 15px/1.6 system-ui, sans-serif; max-width: 880px; margin: 24px auto; padding: 0 16px; color: #1a1f27; }
      h1 { font-size: 28px; line-height: 1.3; }
      h2 { font-size: 18px; margin-top: 20px; }
      fieldset { border: 1px solid #d7dbe2; border-radius: 10px; margin-bottom: 14px; padding: 14px 16px; }
      legend { padding: 0 8px; }
      label { display: inline-block; margin-right: 16px; }
      button { padding: 8px 14px; border-radius: 8px; border: 1px solid #b8bec9; background: #f4f6f9; cursor: pointer; margin-right: 6px; }
      video { width: 240px; border-radius: 8px; background: #111; }
      pre { background: #f4f6f9; padding: 10px; border-radius: 8px; white-space: pre-wrap; max-height: 260px; overflow: auto; }
      .warn { color: #a33; }
    </style>
  </head>
  <body>
    <h1>Gemini Live 시험 도구 (1단계)</h1>
    <p class="warn">실제 모드에서는 비용이 듭니다. 가상의 지원자로만 시험하고, 시험에는 본인 얼굴만 쓰세요.</p>
    <fieldset>
      <legend>설정</legend>
      <label>시험
        <select id="scenario">
          <option value="full">전체 (15분)</option>
          <option value="lock">지시 잠금 (2분)</option>
          <option value="expire">입장권 만료 (4분)</option>
        </select>
      </label>
      <label>분 <input id="minutes" type="number" value="15" min="1" max="16" /></label>
      <label><input id="video" type="checkbox" checked /> 영상 보내기</label>
      <label>침묵 판정(ms) <input id="silenceMs" type="number" value="800" step="100" /></label>
      <label>압축 시작 토큰 <input id="triggerTokens" type="number" value="100000" step="1000" /></label>
      <label>영상 턴 범위
        <select id="turnCoverage">
          <option value="">기본</option>
          <option value="TURN_INCLUDES_ONLY_ACTIVITY">말하는 동안만</option>
        </select>
      </label>
    </fieldset>
    <button id="start">시작</button>
    <button id="stop" disabled>끝내고 저장</button>
    <button id="forceReconnect" disabled>지금 재연결</button>
    <button id="memoryNow" disabled>기억 질문</button>
    <h2>직접 말하는 시험에서 표시</h2>
    <button class="mark" data-mark="에코: AI가 자기 말에 끊김">AI가 자기 말에 끊김</button>
    <button class="mark" data-mark="체감: 답이 늦음">답이 늦음</button>
    <button class="mark" data-mark="체감: 말을 끊음">말을 끊음</button>
    <button class="mark" data-mark="체감: 이상한 꼬리 질문">이상한 꼬리 질문</button>
    <p><video id="self" autoplay muted playsinline></video></p>
    <pre id="status">대기 중</pre>
    <pre id="log"></pre>
    <script type="module" src="./probe.js"></script>
  </body>
</html>
