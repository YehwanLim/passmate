<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:#050505; color:#f7f8fc; font-family:Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .frame { min-height:100vh; position:relative; overflow:hidden; display:flex; flex-direction:column; }
    .frame::before { content:""; position:absolute; width:720px; height:720px; left:50%; top:48%; transform:translate(-50%,-50%); border-radius:50%; background:radial-gradient(circle,rgba(82,115,241,.14),transparent 67%); pointer-events:none; }
    .top { position:relative; z-index:1; display:flex; justify-content:center; padding:38px 24px 0; }
    .brand { color:#f2f4f9; font-size:21px; font-weight:800; letter-spacing:-.07em; }
    .brand i { font-style:normal; color:#91adff; }
    main { position:relative; z-index:1; flex:1; display:flex; align-items:center; justify-content:center; padding:42px 22px 84px; }
    .panel { width:min(100%,448px); text-align:center; }
    h1 { margin:0 0 20px; font-size:26px; font-weight:730; line-height:1.28; letter-spacing:-.06em; }
    h1 span { display:block; white-space:nowrap; }
    .mobile-break { display:none; }
    .google { margin:auto; min-height:42px; display:inline-flex; align-items:center; justify-content:center; gap:10px; padding:0 17px; border:1px solid rgba(255,255,255,.74); border-radius:10px; color:#293241; background:#fff; font-size:13px; font-weight:450; box-shadow:0 0 0 1px rgba(255,255,255,.08),0 0 16px rgba(159,184,255,.16),0 3px 10px rgba(0,0,0,.16); transition:background .18s ease,transform .18s ease,box-shadow .18s ease; }
    .google:hover { background:#f5f6f8; transform:translateY(-1px); box-shadow:0 0 0 1px rgba(255,255,255,.13),0 0 20px rgba(159,184,255,.23),0 4px 12px rgba(0,0,0,.18); }
    .google svg { width:17px; height:17px; flex:0 0 auto; }
    .safe { margin:11px 0 0; color:#687384; font-size:11px; }
    .terms { position:relative; z-index:1; padding:0 22px 28px; text-align:center; color:#5c6573; font-size:11px; line-height:1.6; }
    .terms u { color:#9099a7; text-underline-offset:2px; }
    @media(max-width:430px){ h1{font-size:24px} }
    @media(max-width:360px){ h1{font-size:23px;line-height:1.32} .mobile-break{display:block} }
  </style>
</head>
<body>
  <div class="frame">
    <header class="top"><div class="brand"><i>Pre</i>View</div></header>
    <main>
      <section class="panel">
        <h1><span>지금 로그인하고,</span><span>자소서 분석 결과를 <br class="mobile-break"/>확인해 보세요.</span></h1>
        <button class="google">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Google 계정으로 3초 만에 시작하기
        </button>
        <p class="safe">⌾ Google 계정 비밀번호는 PreView에 저장되지 않아요</p>
      </section>
    </main>
    <footer class="terms">로그인 시 <u>이용약관</u> 및 <u>개인정보 처리방침</u>에 동의하는 것으로 간주합니다.</footer>
  </div>
</body>
</html>
