<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pre:View — Wordmark refinement</title>
    <style>
      * { box-sizing:border-box; } body { margin:0; min-height:100vh; background:#080808; color:#f4f4f5; font-family:Inter, Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .wrap { width:min(1080px, calc(100% - 44px)); margin:0 auto; padding:58px 0 76px; }.eyebrow { color:#38bdf8; font-size:11px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; }h1 { margin:11px 0 10px; font-size:clamp(29px,4.4vw,47px); letter-spacing:-.055em; line-height:1.1; }.lead { margin:0; color:#99999f; font-size:15px; line-height:1.7; }
      .preview { margin-top:38px; overflow:hidden; border:1px solid #252526; border-radius:17px; background:#0d0d0e; }.nav { display:flex; align-items:center; justify-content:space-between; height:78px; padding:0 31px; border-bottom:1px solid #222224; }.brand { color:#f5f5f5; font-size:29px; font-weight:750; letter-spacing:-.035em; line-height:1; }.brand .colon { color:#38bdf8; display:inline-block; padding:0 .055em; }.links { display:flex; align-items:center; gap:22px; color:#88888f; font-size:12px; font-weight:650; }.button { padding:9px 13px; border-radius:8px; background:#f4f4f5; color:#0b0b0b; }
      .canvas { display:flex; align-items:center; justify-content:center; min-height:360px; background:linear-gradient(115deg,#0d0d0e,#0a0a0b); }.display { color:#f7f7f8; font-size:clamp(52px,10vw,118px); font-weight:750; letter-spacing:-.045em; line-height:1; }.display .colon { color:#38bdf8; display:inline-block; padding:0 .045em; }.note { margin-top:20px; color:#a5a5ab; font-size:13px; line-height:1.65; }.note strong{color:#f5f5f6;}@media(max-width:620px){.nav{height:64px;padding:0 20px}.brand{font-size:25px}.links{display:none}.canvas{min-height:280px}}
    </style>
  </head>
  <body><main class="wrap"><div class="eyebrow">Pre:View / wordmark refinement</div><h1>조금 더 단단하게.</h1><p class="lead">바로 전 시안에서 전체 자간과 콜론 주변의 여백을 한 단계만 줄였습니다.</p><section class="preview"><div class="nav"><div class="brand">Pre<span class="colon">:</span>View</div><div class="links"><span>서비스 소개</span><span>자소서 분석</span><span class="button">시작하기</span></div></div><div class="canvas"><div class="display">Pre<span class="colon">:</span>View</div></div></section><p class="note"><strong>조정:</strong> 이전 시안보다 더 촘촘하지만, 처음처럼 답답하지 않은 중간 간격입니다.</p></main></body>
</html>
