# 프로덕션 배포가 성공하면 최근에 바뀐 페이지를 IndexNow 로 네이버에 알린다.
# Vercel Git 연동이 만드는 GitHub deployment 의 성공 이벤트를 받는다. 비밀값은 필요 없다(키는 공개값).
name: IndexNow

on:
  deployment_status:

permissions:
  contents: read

jobs:
  ping:
    if: github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 도메인이 새 배포로 넘어가는 몇 초를 기다린다.
      - run: sleep 30
      - run: node scripts/indexnow-ping.mjs
